<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4efe6">
  <link rel="preload" href="/static/vendor/fonts/instrument-sans-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/vendor/fonts/fraunces-normal.woff2" as="font" type="font/woff2" crossorigin>
  <title>AfterCare</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2312634f'/%3E%3Cpath d='M7 21.5h18M11 21.5a5 5 0 0 1 10 0M16 9.5v2.2M10.6 12.3l1.5 1.5M21.4 12.3l-1.5 1.5' fill='none' stroke='%23f4efe6' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
  <script>
    // Not logged in: go to the login page before anything renders.
    if (!localStorage.getItem('aftercare_token')) window.location.replace('/');
  </script>
</head>
<body class="app-page">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="app-header">
    <div class="container header-row">
      <a class="brand" href="#instructions" aria-label="AfterCare home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M3.5 17h17M7 17a5 5 0 0 1 10 0M12 6.25v2.5M6.2 9.2l1.75 1.75M17.8 9.2l-1.75 1.75" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </span>
        <span class="brand-name">AfterCare</span>
      </a>
      <nav class="tabs" aria-label="Sections">
        <a class="tab" href="#instructions" data-tab="instructions"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 4.5h-2a1.5 1.5 0 0 0-1.5 1.5v13a1.5 1.5 0 0 0 1.5 1.5h11a1.5 1.5 0 0 0 1.5-1.5V6a1.5 1.5 0 0 0-1.5-1.5h-2M9 3.5h6v2.5H9zM8.5 11h7M8.5 15h4.5"/></svg><span class="tab-label">Instructions</span></a>
        <a class="tab" href="#today" data-tab="today" data-requires-confirmed><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.25"/><path d="M8.6 12.3l2.3 2.3 4.6-5"/></svg><span class="tab-label">Today</span></a>
        <a class="tab" href="#ask" data-tab="ask" data-requires-confirmed><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.75 7A2.75 2.75 0 0 1 7.5 4.25h9A2.75 2.75 0 0 1 19.25 7v6.5a2.75 2.75 0 0 1-2.75 2.75H11.5L7 19.75v-3.5A2.5 2.5 0 0 1 4.75 13.75z"/><path d="M8.75 9.25h6.5M8.75 12.25h4"/></svg><span class="tab-label">Ask</span></a>
        <a class="tab" href="#careteam" data-tab="careteam"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9.25" cy="8.5" r="3.25"/><path d="M3.5 19.5a5.75 5.75 0 0 1 11.5 0"/><path d="M15.25 5.6a3.25 3.25 0 0 1 0 5.8M17.25 14.4a5.75 5.75 0 0 1 3.25 5.1"/></svg><span class="tab-label">Care team</span></a>
      </nav>
      <div class="header-user">
        <span class="avatar" id="avatar" aria-hidden="true"></span>
        <span class="username" id="username"></span>
        <button id="logoutBtn" type="button" class="btn btn-ghost btn-small">Log out</button>
      </div>
    </div>
  </header>

  <main id="main" class="container app-main" tabindex="-1">
    <section class="panel" id="panel-instructions" data-panel="instructions" aria-label="Instructions" hidden></section>
    <section class="panel" id="panel-today" data-panel="today" aria-label="Today" hidden></section>
    <section class="panel" id="panel-ask" data-panel="ask" aria-label="Ask" hidden></section>
    <section class="panel" id="panel-careteam" data-panel="careteam" aria-label="Care team" hidden></section>
  </main>

  <footer class="disclaimer">AfterCare is a class project, not medical advice. In an emergency, call 911.</footer>

  <script type="module">
    import {api, clearSession, escapeHtml, getTab, savedUsername} from '/static/api.js';
    import {enter, syncTabs} from '/static/shell.js';
    // Tab modules register themselves on import. Add new tabs here.
    import '/static/review.js';
    import '/static/today.js';
    import '/static/ask.js';
    import {onCareTeamChange, refreshCareTeam, unseenAnswerCount} from '/static/careteam.js';

    const LOCKED_HINT = 'Confirm your instructions first';
    const TAB_IDS = ['instructions', 'today', 'ask', 'careteam'];
    const TAB_TITLES = {instructions: 'Instructions', today: 'Today', ask: 'Ask', careteam: 'Care team'};
    const state = {document: null, username: savedUsername(), ready: false};

    const isConfirmed = () => state.document !== null && state.document.status === 'confirmed';
    const isLocked = id => !isConfirmed() &&
      document.querySelector(`.tab[data-tab="${id}"]`).hasAttribute('data-requires-confirmed');

    function currentTab() {
      const id = window.location.hash.slice(1);
      return TAB_IDS.includes(id) ? id : 'instructions';
    }

    const ctx = {
      get document() { return state.document; },
      get username() { return state.username; },
      setDocument(doc) {
        state.document = doc;
        render();
      },
      async reloadDocument() {
        state.document = await loadDocument();
        render();
      },
      go(id) {
        if (window.location.hash === '#' + id) render();
        else window.location.hash = id;
      },
    };

    async function loadDocument() {
      try {
        return await api('/api/documents/active');
      } catch (error) {
        if (error.status === 404) return null;
        throw error;
      }
    }

    // Small count on the Care team tab for answers this browser has not seen yet.
    function renderBadge() {
      const tab = document.querySelector('.tab[data-tab="careteam"]');
      let badge = tab.querySelector('.tab-badge');
      const count = unseenAnswerCount();
      if (!count) {
        if (badge) badge.remove();
        return;
      }
      if (!badge) {
        badge = document.createElement('span');
        badge.className = 'tab-badge';
        tab.append(badge);
      }
      badge.textContent = String(count);
      badge.setAttribute('role', 'img');
      badge.setAttribute('aria-label', count === 1 ? '1 new answer' : `${count} new answers`);
    }
    onCareTeamChange(renderBadge);

    function renderTabs(active) {
      document.querySelectorAll('.tab').forEach(tab => {
        const id = tab.dataset.tab;
        const locked = isLocked(id);
        tab.classList.toggle('is-locked', locked);
        if (locked) tab.title = LOCKED_HINT;
        else tab.removeAttribute('title');
        if (id === active) tab.setAttribute('aria-current', 'page');
        else tab.removeAttribute('aria-current');
      });
      syncTabs(document.querySelector('.tabs'));
    }

    function renderLocked(panel) {
      panel.innerHTML = `
        <div class="empty-state">
          <span class="empty-mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="26" height="26"><path d="M7.5 10.5V8a4.5 4.5 0 0 1 9 0v2.5M6.5 10.5h11a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1zM12 14v2.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <p class="eyebrow">${escapeHtml(TAB_TITLES[currentTab()])}</p>
          <h1 class="empty-title">${escapeHtml(LOCKED_HINT)}</h1>
          <p class="empty-text">This section opens after you review and confirm the instructions from your discharge document.</p>
          <a class="btn btn-primary" href="#instructions">Go to Instructions</a>
        </div>`;
    }

    function renderPlaceholder(panel, id) {
      panel.innerHTML = `
        <div class="empty-state">
          <h1 class="empty-title">${escapeHtml(TAB_TITLES[id])}</h1>
          <p class="empty-text">This section is coming soon.</p>
        </div>`;
    }

    let lastTab = null;
    function render() {
      if (!state.ready) return;
      const active = currentTab();
      const switched = active !== lastTab;
      lastTab = active;
      renderTabs(active);
      document.querySelectorAll('.panel').forEach(panel => {
        panel.hidden = panel.dataset.panel !== active;
      });
      const panel = document.getElementById('panel-' + active);
      const module = getTab(active);
      if (isLocked(active)) renderLocked(panel);
      else if (module) module.show(panel, ctx);
      else renderPlaceholder(panel, active);
      if (switched) enter(panel);
      document.title = TAB_TITLES[active] + ' - AfterCare';
    }

    function renderFatal(message) {
      const panel = document.getElementById('panel-instructions');
      document.querySelectorAll('.panel').forEach(p => { p.hidden = p !== panel; });
      panel.innerHTML = `
        <div class="empty-state">
          <h1 class="empty-title">AfterCare could not load</h1>
          <p class="empty-text">${escapeHtml(message)}</p>
          <button type="button" class="btn btn-primary" onclick="window.location.reload()">Try again</button>
        </div>`;
    }

    document.getElementById('logoutBtn').addEventListener('click', () => {
      clearSession();
      window.location.href = '/';
    });
    window.addEventListener('hashchange', () => {
      render();
      window.scrollTo(0, 0);
    });

    function showUser(name) {
      document.getElementById('username').textContent = name;
      document.getElementById('avatar').textContent = (name || '?').trim().charAt(0).toUpperCase();
    }
    showUser(state.username);
    async function boot() {
      try {
        const me = await api('/api/me');
        if (me.role === 'doctor') { window.location.replace('/doctor'); return; }
        state.username = me.username;
        showUser(me.username);
        state.document = await loadDocument();
        state.ready = true;
        render();
        refreshCareTeam();
      } catch (error) {
        if (error.status !== 401) renderFatal(error.message);
      }
    }
    boot();
  </script>
</body>
</html>
