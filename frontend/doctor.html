<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AfterCare - Doctor</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230f766e'/%3E%3Cpath d='M16 9v14M9 16h14' stroke='white' stroke-width='3.2' stroke-linecap='round'/%3E%3C/svg%3E">
  <script>
    // Not logged in: go to the login page before anything renders.
    if (!localStorage.getItem('aftercare_token')) window.location.replace('/');
  </script>
</head>
<body class="app-page">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="app-header">
    <div class="container header-row">
      <a class="brand" href="/doctor" aria-label="AfterCare doctor home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
        </span>
        <span class="brand-name" id="brandName">AfterCare</span>
      </a>
      <div class="header-user">
        <button id="logoutBtn" type="button" class="btn btn-ghost btn-small">Log out</button>
      </div>
    </div>
    <nav class="container tabs doctor-tabs" aria-label="Sections">
      <a class="tab" href="#questions" data-tab="questions" id="tabQuestions">Questions</a>
      <a class="tab" href="#guidance" data-tab="guidance">My guidance</a>
    </nav>
  </header>

  <main id="main" class="container app-main" tabindex="-1"></main>

  <footer class="disclaimer">AfterCare is a class project, not medical advice. All doctor and patient data is fictional.</footer>

  <script type="module" src="/static/doctor.js"></script>
</body>
</html>
