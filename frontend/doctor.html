<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4efe6">
  <link rel="preload" href="/static/vendor/fonts/instrument-sans-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/vendor/fonts/fraunces-normal.woff2" as="font" type="font/woff2" crossorigin>
  <title>AfterCare - Doctor</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2312634f'/%3E%3Cpath d='M7 21.5h18M11 21.5a5 5 0 0 1 10 0M16 9.5v2.2M10.6 12.3l1.5 1.5M21.4 12.3l-1.5 1.5' fill='none' stroke='%23f4efe6' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
  <script>
    // Not logged in: go to the login page before anything renders.
    if (!localStorage.getItem('aftercare_token')) window.location.replace('/');
  </script>
</head>
<body class="app-page doctor-page">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="app-header">
    <div class="container header-row">
      <a class="brand" href="/doctor" aria-label="AfterCare doctor home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M3.5 17h17M7 17a5 5 0 0 1 10 0M12 6.25v2.5M6.2 9.2l1.75 1.75M17.8 9.2l-1.75 1.75" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </span>
        <span class="brand-name">AfterCare</span>
        <span class="brand-role">Clinician</span>
      </a>
      <nav class="tabs doctor-tabs" aria-label="Sections">
        <a class="tab" href="#questions" data-tab="questions" id="tabQuestions"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 13.5l2.1-7.3A1.75 1.75 0 0 1 8.3 5h7.4a1.75 1.75 0 0 1 1.7 1.2l2.1 7.3v4.75A1.75 1.75 0 0 1 17.75 20H6.25a1.75 1.75 0 0 1-1.75-1.75z"/><path d="M4.5 13.5h4l1 2h5l1-2h4"/></svg><span class="tab-label">Questions</span></a>
        <a class="tab" href="#guidance" data-tab="guidance"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.5C10.4 5.2 8.3 4.75 5 4.75v13.5c3.3 0 5.4.45 7 1.75 1.6-1.3 3.7-1.75 7-1.75V4.75c-3.3 0-5.4.45-7 1.75zM12 6.5V20"/></svg><span class="tab-label">My guidance</span></a>
        <a class="tab" href="#labels" data-tab="labels" id="tabLabels"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 19.5l9-9a4.6 4.6 0 0 0-6.5-6.5l-9 9a4.6 4.6 0 0 0 6.5 6.5zM8.75 8.75l6.5 6.5"/></svg><span class="tab-label">Drug labels</span></a>
      </nav>
      <div class="header-user">
        <span class="avatar" id="avatar" aria-hidden="true"></span>
        <span class="user-meta"><span class="username" id="brandName"></span><span class="user-specialty" id="brandSpecialty" hidden></span></span>
        <button id="logoutBtn" type="button" class="btn btn-ghost btn-small">Log out</button>
      </div>
    </div>
  </header>

  <main id="main" class="container app-main" tabindex="-1"></main>

  <footer class="disclaimer">AfterCare is a class project, not medical advice. All doctor and patient data is fictional.</footer>

  <script type="module" src="/static/doctor.js"></script>
</body>
</html>
